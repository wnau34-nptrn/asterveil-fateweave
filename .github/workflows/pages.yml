name: Publish playable prototype

on:
  push:
    branches: [feature/fateweave-initial-prototype, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pre-release (owner 2026-11-04): the full browser gate already runs on every PR (browser.yml), so pushes deploy after
  # lint/unit/build only. Run this workflow manually (workflow_dispatch) for a full browser check of the branch.
  # Before the external test (OD-13), remove the `if:` below and put `browser` back into deploy's `needs`.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build job above already type-checks this commit and deploy needs both jobs; shards only need the bundle.
      - run: npx vite build --base=/asterveil-fateweave/
      - run: npx playwright install --with-deps chromium
      - name: Verify painted blade, defense, healing, projectile, earth, alchemy and arcane seal source fixtures
        if: matrix.shard == 1
        env:
          PLAYWRIGHT_PAGES: 'false'
        run: npm run test:browser -- tests/browser/blade-fx.spec.ts tests/browser/defense-fx.spec.ts tests/browser/healing-fx.spec.ts tests/browser/projectile-fx.spec.ts tests/browser/earth-fx.spec.ts tests/browser/alchemy-fx.spec.ts tests/browser/arcane-seal-fx.spec.ts tests/browser/unit-a1.spec.ts tests/browser/unit-a2.spec.ts tests/browser/unit-a3.spec.ts tests/browser/unit-a4.spec.ts tests/browser/unit-a5.spec.ts tests/browser/unit-a6.spec.ts tests/browser/command-fx.spec.ts tests/browser/song-fx.spec.ts tests/browser/foe-signature-fx.spec.ts --workers=1 tests/browser/unit-a8.spec.ts tests/browser/unit-a10.spec.ts tests/browser/unit-a7.spec.ts tests/browser/unit-a9.spec.ts tests/browser/saint-dance-fx.spec.ts tests/browser/field-a11.spec.ts
      - name: Verify production gameplay under the Pages subpath (shard ${{ matrix.shard }}/4)
        env:
          PLAYWRIGHT_PAGES: 'true'
        run: npm run test:browser -- --fully-parallel --shard=${{ matrix.shard }}/4
      # Keep failure screenshots and page snapshots so a CI-only failure can be diagnosed.
      - name: Upload browser test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
