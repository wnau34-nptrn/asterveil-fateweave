name: Cloudflare permission probe

# P09-02b step 1: proves the CLOUDFLARE_API_TOKEN secret can create/query/delete
# a D1 database and deploy/delete a Worker with a SQLite Durable Object.
# Uses throwaway dev resources only and deletes them in every outcome.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER: npx --yes wrangler@4.153.0
      D1_NAME: asterveil-probe-dev-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: D1 create, query, delete
        id: d1
        run: |
          set -o pipefail
          echo "## D1" >> "$GITHUB_STEP_SUMMARY"
          $WRANGLER d1 create "$D1_NAME" 2>&1 | grep -iE 'success|error|creat' | grep -v '@'
          $WRANGLER d1 execute "$D1_NAME" --remote --yes --json --command "CREATE TABLE t (n INTEGER); INSERT INTO t VALUES (41); SELECT n + 1 AS answer FROM t;" > /tmp/d1.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8')); const ok=r.some(x=>x.results?.some(row=>row.answer===42)); console.log('answer 42:', ok); if(!ok) process.exit(1)"
          echo "D1 create/query OK" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Worker with SQLite Durable Object
        id: deploy
        working-directory: cloudflare/probe
        run: |
          set -o pipefail
          $WRANGLER deploy > /tmp/deploy.txt 2>&1 || { grep -v '@' /tmp/deploy.txt | tail -n 20; exit 1; }
          grep -iE 'uploaded|deployed|workers.dev' /tmp/deploy.txt | grep -v '@'
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -n1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Call /health and Durable Object endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          const get = async (path) => {
            for (let attempt = 1; ; attempt++) {
              try {
                const r = await fetch(new URL(path, process.env.WORKER_URL), { signal: AbortSignal.timeout(10000) });
                assert.equal(r.status, 200);
                return await r.json();
              } catch (e) { if (attempt === 8) throw e; await setTimeout(5000); }
            }
          };
          assert.equal((await get('/health')).status, 'ok');
          const a = await get('/do'), b = await get('/do');
          assert.equal(b.hits, a.hits + 1);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Worker + Durable Object\n/health OK, DO SQLite counter ${a.hits} → ${b.hits}\n`);
          NODE
      - name: Delete probe Worker
        if: always()
        working-directory: cloudflare/probe
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        # Wrangler prints the account name (it contains the owner's e-mail): keep only the result lines.
        run: |
          printf 'y\n' | $WRANGLER delete --force 2>&1 | grep -iE 'success|delet|error|not exist' | grep -v '@' || true
          code=$(curl -s -o /dev/null -w '%{http_code}' "${WORKER_URL}/health" || true)
          echo "probe /health after delete: HTTP $code"
          echo "Probe Worker after delete: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete probe D1
        if: always()
        run: $WRANGLER d1 delete "$D1_NAME" --skip-confirmation 2>&1 | grep -iE 'delet|error' | grep -v '@' || true
