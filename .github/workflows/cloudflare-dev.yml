name: Cloudflare development API

on:
  pull_request:
    paths: ['cloudflare/**', 'src/server/**', 'src/core/**', 'src/content/**', 'tests/server-api.test.ts', 'tests/server-account.test.ts', 'tests/server-safety.test.ts', 'tests/server-telemetry.test.ts', 'tests/server-perf.test.ts', 'tests/server-measure.test.ts', 'tests/fixtures/server-*.ts', 'scripts/content-version.mjs', '.github/workflows/cloudflare-dev.yml']
  push:
    branches: [feature/fateweave-initial-prototype]
    paths: ['cloudflare/**', 'src/server/**', 'src/core/**', 'src/content/**', 'scripts/content-version.mjs', '.github/workflows/cloudflare-dev.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dev
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.153.0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/server-api.test.ts tests/server-account.test.ts tests/server-perf.test.ts tests/server-safety.test.ts tests/server-telemetry.test.ts
      - name: Bundle Worker without accessing Cloudflare
        run: $WRANGLER deploy --dry-run --config cloudflare/wrangler.json --outdir /tmp/asterveil-worker

  # Deploys the dev API (Worker + per-account Durable Object + D1 `asterveil-dev`) and runs the smoke test against it.
  # Wrangler prints the account name, which contains the owner's e-mail: every Wrangler output is filtered.
  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/fateweave-initial-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment credentials without printing them
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing repository secret: ${name}`);
          }
          if (!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID)) throw new Error('CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID');
          NODE
      - name: Find or create the dev D1 database and write the deploy config
        run: |
          set -o pipefail
          $WRANGLER d1 list --json > /tmp/d1-list.json 2>/tmp/d1-list.err || { grep -v '@' /tmp/d1-list.err | tail -n 20; exit 1; }
          if ! node -e "const l=JSON.parse(require('fs').readFileSync('/tmp/d1-list.json','utf8')); process.exit(l.some(d=>d.name==='asterveil-dev')?0:1)"; then
            $WRANGLER d1 create asterveil-dev 2>&1 | grep -iE 'success|creat|error' | grep -v '@'
            $WRANGLER d1 list --json > /tmp/d1-list.json 2>/dev/null
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const db = JSON.parse(readFileSync('/tmp/d1-list.json', 'utf8')).find(d => d.name === 'asterveil-dev');
          if (!db?.uuid) throw new Error('asterveil-dev D1 database not found');
          const config = JSON.parse(readFileSync('cloudflare/wrangler.json', 'utf8'));
          config.d1_databases[0].database_id = db.uuid;
          writeFileSync('cloudflare/wrangler.deploy.json', JSON.stringify(config, null, 2));
          NODE
          echo "CONTENT_VERSION=$(node scripts/content-version.mjs)" >> "$GITHUB_ENV"
      - name: Apply D1 migrations
        run: $WRANGLER d1 migrations apply DB --remote --config cloudflare/wrangler.deploy.json 2>&1 | grep -vE '@|Account' | tail -n 15
      - name: Deploy
        id: deploy
        run: |
          $WRANGLER deploy --config cloudflare/wrangler.deploy.json --var "CONTENT_VERSION:$CONTENT_VERSION" > /tmp/deploy.txt 2>&1 || { grep -v '@' /tmp/deploy.txt | tail -n 30; exit 1; }
          grep -iE 'uploaded|deployed|workers.dev|Durable|D1' /tmp/deploy.txt | grep -v '@'
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -n1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test with Workers Tail CPU times
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          # P09-02f: the smoke and measurement accounts are made admins in D1 for the audit and removed afterwards.
          ADMIN_D1_CONFIG: cloudflare/wrangler.deploy.json
        run: |
          for attempt in 1 2 3 4 5 6; do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/health")" = 200 ] && break; sleep 5
          done
          # A new version reaches every edge over some seconds; /health is the same in all versions, so wait until the
          # newest route (/v1/session, 401 without a token; 404 on older versions) answers 5 times in a row.
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Fateweave-Content: $CONTENT_VERSION" "$WORKER_URL/v1/session" || true)
            if [ "$code" = 401 ]; then ok=$((ok + 1)); [ "$ok" -ge 5 ] && break; else ok=0; fi
            sleep 2
          done
          (timeout 540 $WRANGLER tail --config cloudflare/wrangler.deploy.json --format json > /tmp/tail.json 2>/dev/null &) ; sleep 12
          node cloudflare/smoke.mjs "$WORKER_URL" "$CONTENT_VERSION" | tee /tmp/smoke.txt
          smoke=${PIPESTATUS[0]}
          # P09-02d/02f: a fresh account played to a 300-command log (one battle command per turn) and audited at 50/150/300 (as
          # admin), then a late local save imported into another fresh account and audited.
          (MEASURE_URL="$WORKER_URL" MEASURE_CONTENT="$CONTENT_VERSION" npx vitest run tests/server-measure.test.ts 2>&1 || echo 'measurement run failed') | grep -vE 'ExperimentalWarning|trace-warnings' | tail -n 25 | tee /tmp/measure.txt
          sleep 15
          {
            echo "## Development API (content $CONTENT_VERSION)"
            if [ "$smoke" = 0 ]; then echo "$WORKER_URL — smoke test passed (guest, session, createCommander, retry, gap, depart, state, one-device 423, admin-only replay audit, recovery code, Google config, sign-out, deletion request/cancel, rotation, report, feedback; no seed in any response)."; else echo "$WORKER_URL — SMOKE TEST FAILED (exit $smoke)"; fi
            echo '```'; cat /tmp/smoke.txt; echo '```'
            echo "### Long log measurement (round trips from the runner)"
            echo '```'; cat /tmp/measure.txt; echo '```'
            echo "### Workers Tail CPU (ms) by route"
            echo '```'
            node -e "
              const lines=require('fs').readFileSync('/tmp/tail.json','utf8').split('\n').filter(Boolean);
              const out=[]; let buf='';
              for (const l of lines){ buf+=l; try{ out.push(JSON.parse(buf)); buf=''; }catch{} }
              const groups=new Map(); const verify=[];
              for (const e of out){ const r=e.event?.request; const key=(r?new URL(r.url).host.startsWith('game')?'DO ':'Worker ':'-')+(r?new URL(r.url).pathname:'-');
                const cpu=Number(e.cpuTime); if(!Number.isFinite(cpu)) continue;
                if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(cpu); if(key==='DO /verify') verify.push(cpu+'/'+(e.outcome??''));
                if(e.outcome && e.outcome!=='ok') console.log('outcome', key, e.outcome, 'cpu', cpu); }
              for (const [k,v] of groups){ v.sort((a,b)=>a-b); const q=p=>v[Math.min(v.length-1,Math.floor(p*v.length))]; console.log([k,'n='+v.length,'p50='+q(.5),'p95='+q(.95),'max='+v.at(-1)].join('\t')); }
              console.log('DO /verify in order:', verify.join(' '));
              if(!out.length) console.log('no tail events captured');
            " | tee /dev/stderr || echo "tail parse failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The smoke result decides the step (tee alone would hide a failure).
          exit "$smoke"
