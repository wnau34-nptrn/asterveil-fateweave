name: Cloudflare development API

on:
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-dev.yml']
  push:
    branches: [feature/fateweave-initial-prototype]
    paths: ['cloudflare/**', '.github/workflows/cloudflare-dev.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node cloudflare/health.node.mjs
      - name: Bundle Worker without accessing Cloudflare
        run: npx --yes wrangler@4.153.0 deploy --dry-run --config cloudflare/wrangler.json --outdir /tmp/asterveil-worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/fateweave-initial-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check deployment credentials without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing repository secret: ${name}`);
          }
          if (!/^[a-f0-9]{32}$/i.test(process.env.CLOUDFLARE_ACCOUNT_ID)) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID must be the 32-character account ID');
          }
          NODE
      - name: Deploy development probe
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.153.0'
          packageManager: npm
          command: deploy --config cloudflare/wrangler.json
      - name: Verify public development health endpoint
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          if (!process.env.WORKER_URL) throw new Error('Wrangler did not return a deployment URL');
          const url = new URL('/health', process.env.WORKER_URL);
          assert.equal(url.protocol, 'https:');
          assert.ok(url.hostname.endsWith('.workers.dev'));
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000), redirect: 'error' });
              assert.equal(response.status, 200);
              assert.deepEqual(await response.json(), { status: 'ok', service: 'asterveil-api', environment: 'dev' });
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Development API verified: ${url}\n\nInfrastructure probe only; accounts, saves and rewards are not enabled.\n`);
              break;
            } catch (error) {
              if (attempt === 6) throw error;
              await setTimeout(5000);
            }
          }
          NODE
