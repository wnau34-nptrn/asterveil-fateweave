<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Kanit';font-weight:600;src:url('../../../../public/assets/fonts/kanit-600.woff2')}
@font-face{font-family:'Noto Sans Thai';font-weight:400;src:url('../../../../public/assets/fonts/noto-sans-thai-400.woff2')}
@font-face{font-family:'Noto Sans Thai';font-weight:700;src:url('../../../../public/assets/fonts/noto-sans-thai-700.woff2')}
:root{--navy:#08121f;--gold:#f2d596;--gold-edge:#d9bf86;--cyan:#74d4ef;--text:#f4f7fc;--muted:#bbcadb;--glass:rgba(8,18,31,.78);--edge:rgba(232,245,255,.24);--h:'Kanit','Noto Sans Thai',sans-serif;--b:'Noto Sans Thai',sans-serif}
*{box-sizing:border-box}body{margin:0;width:390px;height:844px;overflow:hidden;background:var(--navy);font-family:var(--b);color:var(--text)}
.stage{position:absolute;inset:0;background:url('../../../../public/assets/title/title_party.webp') 50% 50%/cover}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 32% at 50% 14%,#08121f70,#08121f00),linear-gradient(#08121f00 72%,#08121fcc 100%)}
.top{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:12px;color:var(--gold)}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(232,245,255,.5)}
.gear svg,.pill svg,.chips svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.logo{position:absolute;top:70px;left:0;right:0;text-align:center}.logo img{width:270px}
.copy{margin:4px 0 0;font:600 16px var(--h);letter-spacing:.06em;text-shadow:0 1px 8px #000}
.toast{position:absolute;top:240px;left:50%;transform:translateX(-50%);width:max-content;max-width:358px;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);font-size:13px;text-align:center}
.dock{position:absolute;left:16px;right:16px;bottom:18px;display:grid;gap:8px;padding:10px 12px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(6px)}
.save{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.save b{font:600 14px var(--h);color:var(--gold)}
.chips{display:flex;gap:10px;color:var(--text);font-size:12.5px}.chips span{display:inline-flex;align-items:center;gap:4px}.chips svg{width:14px;height:14px;color:var(--cyan)}
.primary{height:50px;border:0;border-radius:14px;font:600 18px var(--h);color:#172135;background:linear-gradient(#fff3d1,#e9c98a);box-shadow:inset 0 1px 0 #fffaf0,inset 0 -3px 0 #b48f4f,0 0 22px rgba(242,213,150,.35)}
.ghost{height:44px;border:1px solid var(--edge);border-radius:12px;background:#0d1c2ecc;color:var(--text);font:600 15px var(--h)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:-2px}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 20px;border-radius:22px 22px 0 0;background:#0b1729f7;border-top:1px solid var(--edge);display:grid;gap:10px;z-index:3}
.scrim{position:absolute;inset:0;background:#050b1499;z-index:3}
.sheet h2{margin:0;font:600 18px var(--h);display:flex;justify-content:space-between;align-items:center}
.sheet h3{margin:0 0 6px;font:600 13px var(--h);color:var(--gold)}
.sec{padding-top:10px;border-top:1px solid #e8f5ff1f}
.item{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#14243a;margin-top:6px;font-size:14px}
.item small{color:var(--muted);font-size:12px}
.tog{width:44px;height:26px;border-radius:999px;background:var(--cyan);position:relative}.tog:after{content:'';position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.danger{color:#ffb4a8;border:1px solid #ffb4a855;background:#2a1418}
.x{width:44px;height:44px;border-radius:50%;background:#14243a;display:grid;place-items:center;font-size:20px}
.tag{position:absolute;bottom:4px;right:6px;font-size:10px;color:#fff8;z-index:9}
</style></head><body><div class="stage"></div><div class="vig"></div><div id="ui"></div>
<script>
const s=new URLSearchParams(location.search).get('s');
const gear='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const cloud='<svg viewBox="0 0 24 24"><path d="M18 10h-1.3A7 7 0 1 0 9 19h9a5 5 0 0 0 0-10z"/></svg>';
const foot='<svg viewBox="0 0 24 24"><path d="M4 16c0-5 2-8 4-8s2 3 2 5-1 5-3 5-3-1-3-2zM14 10c0-4 2-7 4-7s2 3 2 5-1 4-3 4-3 0-3-2z"/></svg>';
const star='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
const flag='<svg viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>';
const ore='<svg viewBox="0 0 24 24"><path d="M12 3l7 6-7 12L5 9z"/></svg>';
const server=s!=='local';
let h='<div class="top">'+(server?'<span class="pill">'+cloud+'เซิร์ฟเวอร์ทดลอง</span>':'<span></span>')+'<span class="gear" aria-label="ตั้งค่า">'+gear+'</span></div>';
h+='<div class="logo"><img src="../../../../public/assets/title/logo.svg"><p class="copy">ข้ามรอยแยก · ถักทอโชคชะตา</p></div>';
if(s==='server')h+='<div class="toast">นำเข้าเซฟเดิม (v58) แล้ว · บันทึกบนเซิร์ฟเวอร์</div>';
if(s==='import'){
 h+='<div class="dock"><div class="save"><b>พบเซฟเดิมในเครื่องนี้</b><span class="chips"><span>'+flag+'ทีม 4</span><span>'+ore+'แร่ 120</span></span></div><button class="primary">นำเข้าเซฟเดิม →</button><button class="ghost">เริ่มใหม่บนเซิร์ฟเวอร์</button><div class="foot">นำเข้าได้ครั้งเดียวต่อบัญชี · เซฟในเครื่องยังอยู่</div></div>';
}else if(s==='new'){
 h+='<div class="dock"><button class="primary">เริ่มเกม →</button><div class="foot">ชายแดนแอสเตอร์เวล</div></div>';
}else{
 h+='<div class="dock"><div class="save"><b>ค่ายรุ่งอรุณ · กำลังเดินทาง</b><span class="chips"><span>'+foot+'12 ก้าว</span><span>'+star+'ชนะ 3</span></span></div><button class="primary">เดินทางต่อ →</button><div class="foot">ชายแดนแอสเตอร์เวล</div></div>';
}
if(s==='settings'){
 h+='<div class="scrim"></div><div class="sheet"><h2>ตั้งค่า<span class="x">×</span></h2>'
 +'<div class="sec"><h3>บัญชี</h3><div class="item"><span>Google<br><small>ผูกแล้ว · เข้าเล่นเครื่องอื่นได้</small></span><span>›</span></div><div class="item"><span>รหัสกู้คืน<br><small>ออกรหัสใหม่ · ใช้ได้ครั้งเดียว</small></span><span>›</span></div></div>'
 +'<div class="sec"><h3>เสียง</h3><div class="item"><span>เพลง</span><span class="tog"></span></div><div class="item"><span>เอฟเฟกต์</span><span class="tog"></span></div></div>'
 +'<div class="sec"><h3>การบันทึก</h3><div class="item"><span>บันทึกบนเซิร์ฟเวอร์ทดลอง<br><small>เปลี่ยนไปเล่นในเครื่องแทน</small></span><span>›</span></div><div class="item danger"><span>เริ่มเกมใหม่<br><small>ลบค่ายและทีมทั้งหมด · ต้องยืนยัน</small></span><span>›</span></div></div></div>';
}
document.getElementById('ui').innerHTML=h+'<div class="tag">MOCKUP</div>';
</script></body></html>
