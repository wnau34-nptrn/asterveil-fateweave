<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A7 · เมตตา + ธีรัน + ลลิน + วิลา</title><style>body{margin:0;padding:18px;background:#0c1424;color:#eff5ff;font:16px system-ui}main{max-width:760px;margin:auto}h1{font-size:22px}p{line-height:1.6;color:#bdcde0}select,a{font:inherit;color:#eaf3ff;background:#22344b;border:1px solid #748aa1;border-radius:8px;padding:10px;max-width:100%}video{display:block;width:min(390px,100%);height:auto;max-height:80vh;margin:12px auto;background:#050a12}#facts{font-size:14px;overflow-wrap:anywhere}a{display:inline-block;text-decoration:none}</style><main><h1>A7 · เมตตา + ธีรัน + ลลิน + วิลา</h1><p>ท่าจาก UI/Phaser/playback/resolver จริงที่390px รวมช่วงคืนท่า ไม่เร่งเวลาและไม่แทรกเฟรม<br>Chromium จำลองจอมือถือบน cloud ไม่ใช่ผลทดสอบมือถือจริง</p><label>เลือกคลิป <select id="clip-select"></select></label><video id="clip" controls playsinline preload="metadata"></video><p id="facts"></p><a id="download" download>ดาวน์โหลดคลิป</a> <a href="README_TH.md">บัญชีท่า / fallback / ผลตรวจ</a></main><script src="clips.js"></script><script>const select=document.querySelector('#clip-select'),video=document.querySelector('#clip');for(const c of window.unitA7Clips)select.add(new Option(c.file.replace('-390.mp4',''),c.file));function show(){const c=window.unitA7Clips.find(c=>c.file===select.value);if(!c)return;video.src=c.file;document.querySelector('#download').href=c.file;document.querySelector('#facts').textContent=`${c.duration.toFixed(2)}s · ${c.capturedFrames} captured frames · max gap ${c.maxFrameGap}s · PTS error ${c.maxTimestampErrorMs}ms`;history.replaceState(null,'',`#${c.file}`)}const preferred=location.hash.slice(1)||'metta-attack-normal-normal-390.mp4';if([...select.options].some(o=>o.value===preferred))select.value=preferred;select.onchange=show;show();</script></html>
