<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจ VFX ใหม่ · 390px</title><style>body{margin:0;background:#101a2b;color:#e8edf8;font:16px/1.5 system-ui,sans-serif}main{max-width:390px;margin:auto;padding:16px;box-sizing:border-box}h1{font-size:22px}h2{font-size:18px;margin:24px 0 8px}p{font-size:14px;color:#bdc9dc}video{display:block;width:100%;height:auto;background:#070c15;border-radius:8px}a{color:#9fd8ff}details{margin-top:8px;font-size:13px}</style><main><h1>ตรวจ motion ของ VFX ใหม่</h1><p>Chromium touch emulation 390×844 ยังไม่ใช่ผลจากมือถือจริงหรือ iOS Safari คลิปใช้เวลาจริง ไม่สร้างเฟรมแทรก เจ้าของเป็นผู้อนุมัติ motion</p><div id="clips"></div><p><a href="README_TH.md">วิธีสร้างซ้ำและผลตรวจ</a> · <a href="clips.json">ข้อมูลเฟรมและ event จริง</a></p></main><script src="clips.js"></script><script>const names={'coat':'เคลือบพิษ','stack':'เพิ่มชั้นพิษ','tick':'พิษกัดตอนจบรอบ','burst':'ระเบิดพิษและกระเซ็น','storm':'พายุคม 4 hit','early':'พายุคมหยุดเมื่อเป้าล้ม','shadow':'ก้าวเงา: โจมตี → เตรียมหลบ','arcane-gain':'รับประจุเวท','arcane-release':'ปล่อย 3 ประจุเวท','clash':'หมัดปะทะท่าศัตรู'};const modes={normal:'ปกติ',fast:'เร็ว',reduced:'ลดความเข้ม',osreduce:'OS reduced-motion'};for(const clip of window.vfxReworkClips??[]){const base=clip.file.replace('-390.mp4','');const mode=base.split('-').pop();const key=base.slice(0,-mode.length-1);const section=document.createElement('section');const title=document.createElement('h2');title.textContent=`${names[key]??key} · ${modes[mode]??mode}`;section.append(title);const video=document.createElement('video');video.controls=true;video.preload='none';video.playsInline=true;video.src=clip.file;section.append(video);const info=document.createElement('details');const summary=document.createElement('summary');summary.textContent=`${clip.capturedFrames} เฟรม · ช่วงเอฟเฟกต์ห่างสูงสุด ${(clip.heroEffectCapture?.maxFrameGap??clip.maxFrameGap).toFixed(3)} วินาที`;info.append(summary);const link=document.createElement('a');link.href=clip.file;link.textContent='เปิดไฟล์คลิป';info.append(link);section.append(info);document.querySelector('#clips').append(section);}</script></html>
