<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A0/A1 · Eira & Dandelion Sprite</title><style>body{margin:0;padding:18px;background:#0c1424;color:#eff5ff;font:16px system-ui}main{max-width:760px;margin:auto}h1{font-size:22px}p{line-height:1.6;color:#bdcde0}label{display:inline-block;margin:0 10px 14px 0}select,button,a{font:inherit;color:#eaf3ff;background:#22344b;border:1px solid #748aa1;border-radius:8px;padding:10px}video{display:block;width:min(390px,100%);height:auto;max-height:80vh;margin:12px auto;background:#050a12}#facts{font-size:14px;overflow-wrap:anywhere}a{display:inline-block;text-decoration:none}</style><main><h1>A0/A1 · ไอรา + ภูตแดนดิไลออน</h1><p>คลิปจากเกมจริง390px · Eira โจมตี/ร่าย → Seed Spark ตามเทิร์นจริง<br>Sprite มีเพียง Seed Spark ใน catalog; Sigil ที่ผนึกสำเร็จยกเลิกท่าศัตรู</p><label>ท่า <select id="skill"></select></label><label>โหมด <select id="mode"></select></label><video id="clip" controls playsinline preload="metadata"></video><p id="facts"></p><a id="download" download>ดาวน์โหลดคลิป</a> <a href="README_TH.md">Mapping / fallback / ผลตรวจ</a></main><script src="clips.js"></script><script>const skills=['attack','bolt','ward','sigil','storm','aegis','dispel'],labels={attack:'โจมตีปกติ',bolt:'Bolt',ward:'Ward',sigil:'Sigil',storm:'Storm',aegis:'Aegis',dispel:'Dispel'},modeLabels={normal:'ปกติ',fast:'เร็ว',reduced:'ลดความเข้ม',osreduce:'ลดการเคลื่อนไหวOS'},skill=document.querySelector('#skill'),mode=document.querySelector('#mode'),clip=document.querySelector('#clip');for(const s of skills)skill.add(new Option(labels[s],s));function updateModes(){const current=mode.value;mode.replaceChildren();for(const m of ['normal','fast','reduced','osreduce'])if(window.unitA1Clips.some(c=>c.file===`${skill.value}-${m}-390.mp4`))mode.add(new Option(modeLabels[m],m));if([...mode.options].some(o=>o.value===current))mode.value=current;show()}function show(){const c=window.unitA1Clips.find(c=>c.file===`${skill.value}-${mode.value}-390.mp4`);if(!c)return;clip.src=c.file;document.querySelector('#download').href=c.file;document.querySelector('#facts').textContent=`${c.duration.toFixed(2)}s · ${c.capturedFrames} captured frames · max gap ${c.maxFrameGap}s · PTS error ${c.maxTimestampErrorMs}ms · ไม่แทรกเฟรม/ไม่เร่งเวลา`;history.replaceState(null,'',`#${skill.value}-${mode.value}`)}skill.onchange=updateModes;mode.onchange=show;const parts=location.hash.slice(1).split('-');if(skills.includes(parts[0]))skill.value=parts[0];updateModes();if(parts[1]&&[...mode.options].some(o=>o.value===parts[1])){mode.value=parts[1];show()}</script></html>
