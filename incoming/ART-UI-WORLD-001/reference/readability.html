<!doctype html><html lang="th"><head><meta charset="utf-8"><title>Luminous Veil / asset readability</title><link rel="icon" href="../icons/star.svg"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="reference.css"><style>body{overflow:hidden;padding:32px;background:radial-gradient(at 80% 0,#1c3a4c,#08121f 60%)}.read-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.read-panel{padding:16px}.samples{display:flex;gap:8px;align-items:flex-end;margin:12px 0}.sample{flex:none;background-image:url(../tiles/tileset.webp);background-size:calc(var(--t)*4) calc(var(--t)*6);width:var(--t);height:var(--t)}.props{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.prop-sample{width:64px;height:64px;background-image:url(../tiles/decor.webp);background-size:384px 256px}.prop-cell{display:flex;align-items:center;gap:8px;background:#14243a;border-radius:10px;padding:6px;color:#bbcadb;font-size:12px}.landmarks{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.landmarks .read-panel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:12px}.landmarks img{width:120px;height:120px;object-fit:contain}.landmarks .small{width:36px;height:36px}.mono{filter:grayscale(1)}.row{display:flex;gap:12px;align-items:center;font-size:12px;color:#bbcadb}.row img{height:64px;width:64px}.tiny{font-size:12px;color:#bbcadb}</style></head><body><div class="eyebrow">ART-UI-WORLD-001 / INTAKE SPECIMENS</div><h1>Floor, prop & landmark readability</h1><p class="muted">36 px · 64 px · texture remains distinct in grayscale · live specimen labels</p><div class="read-grid" id="floors"></div><div class="props" id="props"></div><div class="landmarks" id="landmarks"></div><div class="panel read-panel row" id="walls"></div><script>
(async()=>{const frames=await fetch('../tiles/tileset.json').then(r=>r.json()),decor=await fetch('../tiles/decor.json').then(r=>r.json());function sample(f,t,mono=false){return `<div class="sample ${mono?'mono':''}" style="--t:${t}px;background-position:${-f.x/128*t}px ${-f.y/128*t}px"></div>`}document.getElementById('floors').innerHTML=['meadow','thicket','scar','sanctum'].map((z,i)=>`<section class="panel read-panel"><h3>${['ทุ่งชายแดน','พงหนามม่านเวล','แผลรอยแยก','ประตูรอยแยก'][i]}</h3><div class="samples">${[0,1,2,3].map(n=>sample(frames[z+'_'+n],36)).join('')}<span class="tiny">36</span></div><div class="samples">${[0,1,2,3].map(n=>sample(frames[z+'_'+n],64)).join('')}</div><div class="samples">${[0,1,2,3].map(n=>sample(frames[z+'_'+n],36,true)).join('')}<span class="tiny">grayscale</span></div></section>`).join('');document.getElementById('props').innerHTML=Object.entries(decor).map(([n,f])=>`<div class="prop-cell"><div class="prop-sample" style="background-position:${-f.x/2}px ${-f.y/2}px"></div><span>${n.replaceAll('_',' ')}</span></div>`).join('');document.getElementById('landmarks').innerHTML=['landmark_camp','landmark_start','landmark_gate','landmark_gate_open','boss_pedestal','landmark_boss_cleared'].map(n=>`<section class="panel read-panel"><img src="../tiles/${n}.webp" alt="${n}"><img class="small" src="../tiles/${n}.webp" alt=""><span>${n.replaceAll('_',' ')}</span></section>`).join('');document.getElementById('walls').innerHTML='<strong>Walls / Fog / Token</strong>'+['wall_top','wall_face','wall_inner'].map(n=>sample(frames[n],64)).join('')+['fog_tile','fog_edge_n','fog_corner_ne','token_frame','step_hint'].map(n=>`<img src="../tiles/${n}.png" alt="${n}">`).join('')+'<span>Complete-cell walls<br>128 px source slots<br>Bottom-centre props</span>';await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));document.documentElement.dataset.ready='true';})();
</script></body></html>
